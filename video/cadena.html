<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="fuentes.css">
<link rel="stylesheet" href="fuentes-kagit.css">
<style>html,body{margin:0;background:#f3eee4}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ───────────────────────────────────────────────────────────────────────────
//  LA CADENA — de Miguel de los Campos a Mario, 158 s, vertical 9:16.
//  Tres estilos del catálogo: TEK ÇİZGİ (una sola línea), KÂĞIT KESİK (papel
//  cortado) y KARAKALEM (lápiz). Un indicador fijo muestra los ocho eslabones.
// ───────────────────────────────────────────────────────────────────────────
const W=1080,H=1920,DUR=158;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const eO=u=>1-Math.pow(1-clamp(u),3);
const eSin=u=>.5-.5*Math.cos(Math.PI*clamp(u));
const eBack=(u,s=1.7)=>{u=clamp(u);return 1+(s+1)*Math.pow(u-1,3)+s*Math.pow(u-1,2)};
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const hash=(a,b,c)=>{let h=(a*374761393+b*668265263+c*2147483647)>>>0;h=((h^(h>>>13))*1274126177)>>>0;return(h>>>0)/4294967296};
const mk=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const shade=(h,k)=>{const A=hex(h);return`rgb(${A.map(v=>Math.round(clamp(v*k,0,255))).join(',')})`};
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`};
const S=mk(),sx=S.getContext('2d'),S2=mk(),sx2=S2.getContext('2d');
let GEO=null,P=null;
function prepGeo(){
  P={deps:GEO.deps.map(d=>({c:d.c,p:new Path2D(d.d)})),borde:new Path2D(GEO.borde),rios:GEO.rios.map(d=>new Path2D(d))};
  const pad=P.deps.filter(d=>d.c.includes('padron'));P.fl=pad[2];P.fl.d=GEO.deps.filter(d=>d.c.includes('padron'))[2].d;
  P.bordePts=[...GEO.borde.matchAll(/([\d.]+) ([\d.]+)/g)].map(m=>[+m[1],+m[2]]);
  P.flPts=[...P.fl.d.matchAll(/([\d.]+) ([\d.]+)/g)].map(m=>[+m[1],+m[2]]);
}
function txt(x,s,px,py,font,color,align='left',ls=0){
  x.font=font;x.fillStyle=color;x.textAlign=align;x.textBaseline='alphabetic';
  if('letterSpacing' in x)x.letterSpacing=ls+'px';x.fillText(s,px,py);if('letterSpacing' in x)x.letterSpacing='0px';
}
// bloque de texto que aparece y se va
function blockAlpha(t,a,b,fi=.5,fo=.4){return Math.min(eO(seg(t,a,a+fi)),1-seg(t,b-fo,b))}

// ═══════════════════ ESTILO 8 · TEK ÇİZGİ (una sola línea) ═══════════════════
const TPAPER='#f3eee4',TINK='#1e1c19',TACC='#c4502f',HY=1040,TN=2600,X0=-80,X1=1160;
class Path{
  constructor(){this.p=[]}
  M(x,y){this.p.push([x,y]);return this}
  L(x,y,n){const[a,b]=this.p[this.p.length-1];n=n||Math.max(2,Math.ceil(Math.hypot(x-a,y-b)/4));for(let i=1;i<=n;i++)this.p.push([lerp(a,x,i/n),lerp(b,y,i/n)]);return this}
  A(cx,cy,rx,ry,a0,a1,n){n=n||Math.max(8,Math.ceil(Math.abs(a1-a0)*Math.max(rx,ry)/4));for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);this.p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return this}
  S(pts,n=16){const Pp=this.p.length?[this.p[this.p.length-1],...pts]:pts;if(!this.p.length)this.p.push(Pp[0]);
    for(let i=0;i<Pp.length-1;i++){const p0=Pp[Math.max(0,i-1)],p1=Pp[i],p2=Pp[i+1],p3=Pp[Math.min(Pp.length-1,i+2)];
      const d=(a,b)=>Math.pow(Math.hypot(b[0]-a[0],b[1]-a[1])||1e-3,.5);
      const t0=0,t1=t0+d(p0,p1),t2=t1+d(p1,p2),t3=t2+d(p2,p3);
      for(let k=1;k<=n;k++){const t=lerp(t1,t2,k/n);
        const A1=p0.map((v,j)=>(t1-t)/(t1-t0)*v+(t-t0)/(t1-t0)*p1[j]),A2=p1.map((v,j)=>(t2-t)/(t2-t1)*v+(t-t1)/(t2-t1)*p2[j]),A3=p2.map((v,j)=>(t3-t)/(t3-t2)*v+(t-t2)/(t3-t2)*p3[j]);
        const B1=A1.map((v,j)=>(t2-t)/(t2-t0)*v+(t-t0)/(t2-t0)*A2[j]),B2=A2.map((v,j)=>(t3-t)/(t3-t1)*v+(t-t1)/(t3-t1)*A3[j]);
        this.p.push(B1.map((v,j)=>(t2-t)/(t2-t1)*v+(t-t1)/(t2-t1)*B2[j]))}}return this}
  done(){this.cum=[0];for(let i=1;i<this.p.length;i++)this.cum.push(this.cum[i-1]+Math.hypot(this.p[i][0]-this.p[i-1][0],this.p[i][1]-this.p[i-1][1]));this.len=this.cum[this.cum.length-1];return this}
  at(s){s=clamp(s,0,this.len);let lo=0,hi=this.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(this.cum[m]<s)lo=m;else hi=m}
    const f=(s-this.cum[lo])/((this.cum[hi]-this.cum[lo])||1),a=this.p[lo],b=this.p[hi];return{x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f)}}
  resample(N){this.done();const o=new Path();for(let i=0;i<N;i++){const a=this.at(this.len*i/(N-1));o.p.push([a.x,a.y])}return o.done()}
}
const Pn=()=>new Path();
const NI=520,NB=1560,NO=TN-NI-NB;
function tekBuild(a,b,body){ // a: x de entrada, b: x de salida, body: Path
  const A=Pn().M(X0,HY).L(a,HY).resample(NI),O=Pn().M(b,HY).L(X1,HY).resample(NO),B=body.resample(NB);
  const r=new Path();r.p=[...A.p,...B.p,...O.p];return r.done();
}
const CIR=(p,cx,cy,r,a0,turns=1)=>p.A(cx,cy,r,r,a0,a0+Math.PI*2*turns);
function iconWheel(){const cx=540,cy=HY-300,r=210,p=Pn().M(300,HY);
  p.S([[380,HY-4],[470,HY-30],[540,cy+r]],14);CIR(p,cx,cy,r,Math.PI/2);
  p.L(cx,cy,24);p.L(cx-r,cy,24);p.L(cx,cy,24);p.L(cx+r,cy,24);p.A(cx,cy,r,r,0,Math.PI/2,16);
  p.S([[600,HY-24],[700,HY-4],[780,HY]],14);return tekBuild(300,780,p)}
function iconMojon(){const p=Pn().M(300,HY);
  p.S([[360,HY-2],[430,HY]],10);p.L(450,HY-420,40);p.L(540,HY-560,20);p.L(630,HY-420,20);p.L(650,HY,40);
  p.L(600,HY-40,10);[[500,HY-130],[590,HY-190],[490,HY-250],[590,HY-310],[520,HY-370]].forEach(([x,y])=>p.L(x,y,10));p.L(540,HY-30,16);
  p.S([[600,HY-4],[700,HY]],10);return tekBuild(300,700,p)}
function iconTile(){const l=370,r=710,t=HY-440,b=HY-100,mx=540,my=HY-270,p=Pn().M(300,HY);
  p.S([[330,HY-4],[360,HY-40],[l,b]],12);p.L(l,t,30);p.L(r,t,30);p.L(r,b,30);p.L(l,b,30);p.L(mx,b,20);p.L(l,my,20);p.L(mx,t,20);p.L(r,my,20);p.L(mx,b,20);
  p.L(mx,my+60,10);p.L(mx-60,my,10);p.L(mx,my-60,10);p.L(mx+60,my,10);p.L(mx,my+60,10);p.L(mx,b,10);
  p.S([[560,HY-60],[640,HY-8],[780,HY]],12);return tekBuild(300,780,p)}
function iconBike(){const rx=380,fx=700,wy=HY-150,R=150,Bx=540,Sx=470,Sy=HY-360,Hx=655,Hy=HY-350,p=Pn().M(220,HY);
  p.S([[300,HY-2],[rx,HY]],12);CIR(p,rx,wy,R,Math.PI/2);p.L(rx,wy,20);p.L(Sx,Sy,30);p.L(Sx-45,Sy-14,8);p.L(Sx+45,Sy-14,10);p.L(Sx,Sy,10);
  p.L(Hx,Hy,40);p.L(Hx-14,Hy-62,10);p.L(Hx+70,Hy-70,12);p.L(Hx,Hy,12);p.L(Bx,wy,36);p.L(Sx,Sy,30);p.L(Bx,wy,30);p.L(rx,wy,26);p.L(Bx,wy,26);p.L(Hx,Hy,36);p.L(fx,wy,30);p.L(fx,HY,20);
  CIR(p,fx,wy,R,Math.PI/2);p.S([[800,HY-8],[900,HY]],12);return tekBuild(220,900,p)}
function iconRings(){const rr=135,ax=465,bx=615,cy=HY-300,dy=Math.sqrt(rr*rr-75*75),p=Pn().M(300,HY);
  const aa=Math.atan2(dy,540-ax),ab=Math.atan2(dy,540-bx);
  p.S([[380,HY-8],[470,HY-60],[540,cy+dy]],12);CIR(p,ax,cy,rr,aa);p.A(bx,cy,rr,rr,ab,ab+Math.PI*2);
  p.S([[560,cy+dy+40],[640,HY-30],[760,HY]],12);return tekBuild(300,760,p)}
function iconCandle(){const p=Pn().M(300,HY);
  p.S([[420,HY-4],[480,HY]],10);p.L(480,HY-400,40);p.L(600,HY-400,20);p.L(600,HY,40);p.L(600,HY-400,40);p.L(540,HY-400,12);p.L(540,HY-450,10);
  p.S([[510,HY-500],[520,HY-570],[540,HY-620],[562,HY-570],[572,HY-500],[540,HY-450]],12);p.L(540,HY-400,12);p.L(540,HY-5,50);
  p.S([[640,HY-4],[740,HY]],10);return tekBuild(300,740,p)}
const TICONS={};
function tekIcons(){TICONS.wheel=iconWheel();TICONS.mojon=iconMojon();TICONS.tile=iconTile();TICONS.bike=iconBike();TICONS.rings=iconRings();TICONS.candle=iconCandle();
  TICONS.wid=new Float32Array(TN);for(let i=0;i<TN;i++){const u=i/TN;TICONS.wid[i]=6.2+1.3*Math.sin(u*37)*Math.sin(u*11.3+1)+.6*Math.sin(u*91)}}
function strokePts(x,pts,i0,i1){
  x.lineCap='round';x.lineJoin='round';x.strokeStyle=TINK;
  for(let a=Math.max(0,Math.floor(i0));a<i1-1;a+=6){const b=Math.min(Math.ceil(i1)-1,a+6);x.lineWidth=TICONS.wid[a];x.beginPath();x.moveTo(pts[a][0],pts[a][1]);for(let k=a+1;k<=b;k++)x.lineTo(pts[k][0],pts[k][1]);x.stroke()}
}
function morph(A,B,tau,stag=.55){const out=new Array(TN);for(let i=0;i<TN;i++){const u=eIO(tau*(1+stag)-stag*(i/TN));out[i]=[lerp(A.p[i][0],B.p[i][0],u),lerp(A.p[i][1],B.p[i][1],u)]}return out}
const PAPERT=mk();
function buildTekPaper(){const c=PAPERT.getContext('2d');c.fillStyle=TPAPER;c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(540,900,300,540,960,1500);g.addColorStop(0,'rgba(255,252,245,.22)');g.addColorStop(1,'rgba(120,100,70,.14)');c.fillStyle=g;c.fillRect(0,0,W,H);
  const id=c.getImageData(0,0,W,H),d=id.data,r=rng(7);for(let k=0;k<d.length;k+=4){const n=(r()-.5)*10;d[k]+=n;d[k+1]+=n;d[k+2]+=n}c.putImageData(id,0,0)}
// escena de línea: iconos = ['wheel',...], tiempos [t_entra, t_fin_dibujo, ...morphs], captions
function tekScene(x,t,dur,cfg){
  x.drawImage(PAPERT,0,0);
  const ic=cfg.icons.map(k=>TICONS[k]),n=ic.length;
  // tiempos: dibuja ic[0] entre in0..in1; luego morphs en m[i]; sale en out0..out1
  let pts=ic[0].p,i0=0,i1=TN,head=null,tail=null;
  if(t<cfg.m[0][0]){const u=eIO(seg(t,cfg.in0,cfg.in1));i1=u*(TN-1)+1;if(u>0&&u<1)head=pts[Math.min(TN-1,Math.floor(i1))];if(u<=0)i1=0}
  else{let k=0;while(k<n-2&&t>=cfg.m[k+1][0])k++;pts=morph(ic[k],ic[k+1],seg(t,cfg.m[k][0],cfg.m[k][1]))}
  if(t>=cfg.out0){const u=eIO(seg(t,cfg.out0,cfg.out1));i0=u*(TN-1);if(u<1)tail=pts[Math.floor(i0)]}
  if(i1-i0>1)strokePts(x,pts,i0,i1);
  const dot=(p)=>{x.save();x.fillStyle=TACC;x.beginPath();x.arc(p[0],p[1],8.5,0,7);x.fill();x.restore()};
  if(head)dot(head);if(tail&&i0>1)dot(tail);
  // textos manuscritos (Cormorant cursiva)
  cfg.caps.forEach(([a,b,ls,size])=>{
    const al=blockAlpha(t,a,b);if(al<=0)return;
    x.save();x.globalAlpha=al;x.translate(0,(1-eO(seg(t,a,a+.6)))*14);
    ls.forEach((s,i)=>{
      const parts=s.split(/(\*[^*]*\*)/).filter(Boolean);x.font=`italic 500 ${size}px "Cormorant Garamond"`;
      const clean=pp=>pp.replace(/\*/g,'');
      const w=parts.reduce((m,pp)=>m+x.measureText(clean(pp)).width,0);let px=W/2-w/2;
      parts.forEach(pp=>{const acc=pp.startsWith('*'),tx=clean(pp);txt(x,tx,px,1280+i*(size*1.2),`italic 500 ${size}px "Cormorant Garamond"`,acc?TACC:TINK);px+=x.measureText(tx).width});
    });
    x.restore();
  });
  if(cfg.over)cfg.over(x,t);
  const fo=seg(t,dur-.4,dur);if(fo>0){x.globalAlpha=fo*.35;x.drawImage(PAPERT,0,0);x.globalAlpha=1}
}
const TEK1={icons:['wheel','mojon'],in0:.5,in1:3.6,m:[[5.6,7.2]],out0:11.4,out1:13.2,
 caps:[[.4,3.0,['Para Mario','y la familia de los Campos.'],58],[3.0,6.1,['Eloy de los Campos,','el padre de Mario,','*fue chofer.*'],66],[6.1,9.6,['Pero su apellido ya estaba','en una *escritura de campo*','de 1810.'],62],[9.6,13.7,['Esta es la cadena','que une las dos cosas.'],68]]};
const TEK10={icons:['wheel','tile','bike'],in0:.4,in1:2.8,m:[[4.2,5.6],[8.2,9.6]],out0:11.0,out1:12.6,
 caps:[[2.6,5.4,['Eloy fue *chofer.*'],76],[5.4,8.6,['Trabajó en una fábrica de baldosas:','*Mosaicos Rivas y Cía.*'],62],[8.6,12.8,['Y corrió en bicicleta','para el *Club Olimpia, de Colón.*'],62]]};
const TEK12={icons:['rings','candle'],in0:.4,in1:2.9,m:[[6.4,7.8]],out0:9.8,out1:10.9,
 caps:[[2.4,5.8,['*26 de enero de 1946.*','Eloy se casa con Reina,','la muchacha de Fraile Muerto.'],60],[5.8,8.0,['Tuvieron dos hijos:','Walter y *Mario.*'],64],[8.0,10.8,['Murió el *9 de enero de 2000,*','el día que cumplía ochenta años.'],60]]};

// ═══════════════════ ESTILO 9 · KÂĞIT KESİK (papel cortado) ═══════════════════
const PCT=mk(768,768);let PCPAT=null;
function buildPCTex(){const c=PCT.getContext('2d'),r=rng(7);c.lineCap='round';
  for(let i=0;i<2200;i++){const x=r()*768,y=r()*768,a=r()*Math.PI*2,l=3+r()*9,dark=r()<.5;c.strokeStyle=dark?`rgba(0,0,0,${.03+r()*.05})`:`rgba(255,255,255,${.035+r()*.05})`;c.lineWidth=.5+r()*.6;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}
  for(let i=0;i<5000;i++){c.fillStyle=r()<.5?'rgba(0,0,0,.035)':'rgba(255,255,255,.05)';c.fillRect(r()*768,r()*768,1.2,1.2)}
  PCPAT=ctx.createPattern(PCT,'repeat')}
// una pieza de papel: sombra + color + borde de luz + fibra
function piece(x,pathFn,color,{shadow=1}={}){
  x.save();if(shadow){x.shadowColor='rgba(25,12,30,.4)';x.shadowBlur=18;x.shadowOffsetY=10;x.shadowOffsetX=3}
  x.beginPath();pathFn(x);x.fillStyle=color;x.fill();x.restore();
  x.save();x.beginPath();pathFn(x);x.clip();x.strokeStyle=shade(color,1.22);x.lineWidth=6;x.beginPath();pathFn(x);x.stroke();
  x.fillStyle=PCPAT;x.fillRect(-200,-200,W+400,H+400);x.restore();
}
function hillPath(y0,amp,seed,off=0,zig=false,step=70){return x=>{const r=rng(seed);x.moveTo(-60,H+80);let first=true;
  for(let px=-120;px<=W+160;px+=step){const k=Math.round((px+off)/step),rr=rng(seed*7+((k%97)+97)%97)();
    const y=y0-(zig?(Math.abs(Math.sin((px+off)/step*1.7+seed))*amp+rr*amp*.3):(Math.sin((px+off)/(step*3.1)+seed)*amp+Math.sin((px+off)/(step*1.3)+seed*2)*amp*.4));
    x.lineTo(px,y)}x.lineTo(W+160,H+80);x.closePath()}}
const rect=(x0,y0,w,h)=>x=>{x.rect(x0,y0,w,h)};
const rrect=(x0,y0,w,h,r)=>x=>{x.roundRect(x0,y0,w,h,r)};
const circ=(cx,cy,r)=>x=>{x.moveTo(cx+r,cy);x.arc(cx,cy,r,0,7)};
const poly=(pts)=>x=>{pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath()};
function star(cx,cy,r,rot=0){return x=>{for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}}
function sky(x,top,bot,h=1500){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(0,0,W,H)}
function pine(x,cx,by,s,col){piece(x,poly([[cx,by-150*s],[cx+48*s,by-60*s],[cx+22*s,by-60*s],[cx+62*s,by],[cx-62*s,by],[cx-22*s,by-60*s],[cx-48*s,by-60*s]]),col)}
function house(x,cx,by,s,body,roof,lit){
  piece(x,rect(cx-80*s,by-110*s,160*s,110*s),body);piece(x,poly([[cx-100*s,by-110*s],[cx,by-190*s],[cx+100*s,by-110*s]]),roof);
  piece(x,rect(cx+34*s,by-60*s,34*s,60*s),shade(body,.7),{shadow:0});
  piece(x,rect(cx-52*s,by-84*s,40*s,40*s),lit?'#ffd27a':shade(body,.8),{shadow:0});
  if(lit){x.save();x.globalCompositeOperation='screen';const g=x.createRadialGradient(cx-32*s,by-64*s,2,cx-32*s,by-64*s,180*s);g.addColorStop(0,'rgba(255,200,110,.55)');g.addColorStop(1,'rgba(255,200,110,0)');x.fillStyle=g;x.fillRect(cx-250*s,by-250*s,500*s,420*s);x.restore()}
}
function cloud(x,cx,cy,s,col='#fff8ee'){piece(x,x=>{x.moveTo(cx-90*s,cy);x.arc(cx-50*s,cy,40*s,Math.PI,0);x.arc(cx,cy-22*s,52*s,Math.PI,0);x.arc(cx+56*s,cy,38*s,Math.PI,0);x.lineTo(cx+94*s,cy+30*s);x.lineTo(cx-90*s,cy+30*s);x.closePath()},col)}
function waves(x,y0,color,t,amp,sp,seed){piece(x,x=>{x.moveTo(-60,H+80);for(let px=-80;px<=W+120;px+=28){const y=y0+Math.sin((px+t*sp)/60+seed)*amp+Math.sin((px+t*sp*.6)/23)*amp*.3;x.lineTo(px,y)}x.lineTo(W+120,H+80);x.closePath()},color)}
function ship(x,cx,cy,s,rot){x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);
  piece(x,x=>{x.moveTo(-110,0);x.lineTo(110,0);x.lineTo(80,46);x.lineTo(-84,46);x.closePath()},'#7a4a26');
