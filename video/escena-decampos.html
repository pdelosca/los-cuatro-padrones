<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0c0a08}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=72;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let GEO=null;
const CREAM='#f1e8d4',INK='#0c0a08',RED='#e2452b';
const OCRE='#e0a63a',CIAN='#63b6e0';
const SERIF='"Bitstream Charter","Liberation Serif",serif',SANS='"Liberation Sans",sans-serif',MONO='"Courier 10 Pitch","Liberation Mono",monospace';
const TR=[158.4,412.5], MV=[228.9,568.9], LP=[226,552], SEA=[372,690], VC=[214,556];
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const easeO=t=>{t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,3)};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function typed(s,t,t0,cps){const n=clamp(Math.floor((t-t0)*cps),0,s.length);return s.slice(0,n)}

// ---------- geometría ----------
let P=null;
function prep(){
  P={deps:GEO.deps.map(d=>({c:d.c,p:new Path2D(d.d)})),borde:new Path2D(GEO.borde),rios:GEO.rios.map(d=>new Path2D(d))};
  // longitud aproximada del borde para animar el trazo
  const pts=[...GEO.borde.matchAll(/([\d.]+) ([\d.]+)/g)].map(m=>[+m[1],+m[2]]);
  let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  P.L=L;
  // los 4 padrones, en el orden en que aparecen en el archivo
  const pad=P.deps.filter(d=>d.c.includes('padron'));
  P.pad={mv:pad[0].p,la:pad[1].p,fl:pad[2].p,cl:pad[3].p};
}


// ---------- cámara ----------
const CX=260,CY=300,SF=1.95;
const CAM=[
 [0,CX,CY,SF*0.92,660],[8,CX,CY,SF*0.92,660],[12.2,CX,CY,SF,650],
 [13.0,248,545,3.1,700],[19.0,248,545,3.2,700],
 [22.2,TR[0]+6,TR[1]-4,3.7,640],[40.0,TR[0]+6,TR[1]-4,3.95,640],
 [43.0,TR[0]+6,TR[1]-4,3.95,640],[48.6,196,486,2.6,650],[72,196,486,2.7,650]
];
function cam(t){
  let i=0;while(i<CAM.length-2&&t>CAM[i+1][0])i++;
  const a=CAM[i],b=CAM[i+1];const u=ease((t-a[0])/(b[0]-a[0]));
  return{cx:lerp(a[1],b[1],u),cy:lerp(a[2],b[2],u),s:Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),u)),sy:lerp(a[4],b[4],u)};
}
// ---------- texto ----------
const CAPS=[ // t0,t1,líneas,énfasis,tamaño
 [8.4,12.4,['Para entenderlo,','hay que volver','ciento sesenta años.'],CREAM,74],
 [12.8,15.8,['1753. Nace Miguel de los Campos','en una aldea de Vizcaya.'],OCRE,56],
 [15.8,19.6,['Cruza el océano','y se casa en Las Piedras','con Clara Chavarría.'],OCRE,60],
 [19.9,23.1,['Su campo queda entre','el Sarandí, el Marincho','y el Yí.'],OCRE,60],
 [23.1,27.0,['Tres gobiernos distintos','se lo ratifican:','1810, 1815, 1821.'],OCRE,62],
 [27.4,30.8,['1830. Su hijo Felipe Pascual','hace jurar la Constitución','en la plaza de Trinidad.'],OCRE,56],
 [30.8,34.2,['1840. Según el propio Felipe,','Venancio Flores','le puso una pistola en el pecho.'],OCRE,54],
 [34.2,37.6,['1864. Los Flores sitian Trinidad.','Felipe negocia y consigue','una declaración firmada.'],OCRE,54],
 [37.6,40.5,['La familia la guarda','cuarenta y nueve años.'],CREAM,66],
 [40.9,44.3,['1885. Nace el departamento de Flores.','Tres hijos de Felipe lo estrenan:','un coronel, un diputado, un comisionado.'],OCRE,48],
 [44.3,47.6,['En 1901 y 1902','mueren dos de ellos.'],CREAM,66],
 [48.0,51.3,['1913. Margarita y Gertrudis,','solteras, con cuatro sobrinas a cargo,','piden una pensión al Senado.'],OCRE,52],
 [51.3,54.4,['Ya no adjuntan escrituras de campo:','una biografía de su padre','y el papel de 1864.'],CREAM,52],
 [54.4,56.8,['6 de junio.','El Senado les vota la pensión.'],CREAM,60],
 [56.8,59.9,['El decreto lo firma el secretario:','Federico Nin Aguilar.'],CIAN,58],
 [59.9,62.9,['Es el primer papel donde aparecen','juntos los apellidos','Nin y de los Campos.'],CREAM,56],
 [63.1,66.3,['Décadas después, otro papel los junta:','el acta de matrimonio de','Mario de los Campos y Erci Nin.'],CREAM,52],
 [66.3,68.6,['De ahí, Pablo,','Facundo y Camila.'],CREAM,70],
];
const KICK=[
 [12.9,19.7,'LAS PIEDRAS  ·  CANELONES',OCRE],
 [20.0,27.1,'TRINIDAD  ·  FLORES',OCRE],
 [27.5,40.6,'FELIPE PASCUAL DE LOS CAMPOS',OCRE],
 [41.0,47.7,'NACE FLORES  ·  1885',OCRE],
 [48.1,56.9,'MONTEVIDEO  ·  SENADO  ·  1913',CREAM],
];
const YEAR=[
 [8.6,12.3,1913,1753,CREAM],[12.8,15.8,1753,1753,OCRE],
 [23.1,27.0,1810,1821,OCRE],[27.4,30.8,1830,1830,OCRE],[30.8,34.2,1840,1840,OCRE],[34.2,37.6,1840,1864,OCRE],[37.6,40.5,1864,1913,OCRE],
 [40.9,44.3,1885,1885,OCRE],[44.3,47.6,1885,1902,OCRE],[48.0,62.9,1913,1913,CREAM]
];
function drawCaption(t){
  for(const [a,b,lines,col,size0] of CAPS){
    if(t<a||t>b)continue;
    const fi=easeO((t-a)/0.55),fo=1-ease((t-(b-0.35))/0.35);
    const al=Math.min(fi,fo);
    const size=size0*1.16;const lh=size*1.26,y0=1480+(3-lines.length)*lh*0.5;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='alphabetic';
    lines.forEach((ln,i)=>{
      const d=clamp((t-a-i*0.16)/0.55,0,1);
      const ai=Math.min(easeO(d),fo);
      ctx.globalAlpha=ai;
      const yy=y0+i*lh+ (1-easeO(d))*22;
      ctx.font=(i===0&&lines.length>2&&col!==CREAM&&/^\d/.test(ln)?'700 ':'400 ')+size+'px '+SERIF;
      ctx.fillStyle=(i===0&&col!==CREAM&&/^\d/.test(ln))?col:CREAM;
      ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=24;
      ctx.fillText(ln,W/2,yy);
    });
    ctx.restore();
  }
}
function drawKicker(t){
  for(const [a,b,txt,col] of KICK){
    if(t<a||t>b)continue;
    const al=Math.min(easeO((t-a)/0.6),1-ease((t-(b-0.4))/0.4));
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=col;ctx.textAlign='center';
    ctx.font='700 34px '+SANS;
    if('letterSpacing' in ctx)ctx.letterSpacing='9px';
    ctx.fillText(txt,W/2+4,1250);
    ctx.globalAlpha=al*0.6;ctx.fillRect(W/2-60,1276,120,3);
    ctx.restore();
  }
}
function drawYear(t){
  for(const [a,b,y0,y1,col] of YEAR){
    if(t<a||t>b)continue;
    const u=ease((t-a)/(b-a-0.2));
    const yr=Math.round(lerp(y0,y1,u));
    const al=Math.min(easeO((t-a)/0.4),1-ease((t-(b-0.25))/0.25));
    ctx.save();ctx.globalAlpha=al*0.95;ctx.fillStyle=col;ctx.textAlign='left';
    ctx.font='400 120px '+SERIF;ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=30;
    ctx.fillText(String(yr),70,190);
    ctx.restore();
  }
}


// ---------- mapa ----------
function mapLayer(t){
  const c=cam(t);
  ctx.save();
  ctx.translate(W/2,c.sy);ctx.scale(c.s,c.s);ctx.translate(-c.cx,-c.cy);
  const px=1/c.s;
  let mapA=ease((t-7.0)/1.6);
  if(t>63)mapA=1-0.45*ease((t-63)/2.4);
  if(t>68.3)mapA*=1-0.6*ease((t-68.3)/1.0);
  const drawIn=ease((t-7.0)/3.2);
  ctx.globalAlpha=mapA;
  for(const d of P.deps){ctx.fillStyle='#181410';ctx.fill(d.p);ctx.strokeStyle='rgba(241,232,212,.14)';ctx.lineWidth=0.8*px;ctx.stroke(d.p)}
  ctx.strokeStyle='rgba(99,182,224,.28)';ctx.lineWidth=1.4*px;ctx.lineCap='round';
  for(const r of P.rios)ctx.stroke(r);
  // Flores (ocre) y Montevideo (cian)
  const gf=Math.max(ease((t-9.4)/1.0)*0.7,ease((t-19.5)/1.2),0)*(t>63?0.7:1);
  if(gf>0.001){ctx.globalAlpha=mapA*gf*0.30;ctx.fillStyle=OCRE;ctx.fill(P.pad.fl);ctx.globalAlpha=mapA*gf;ctx.strokeStyle=OCRE;ctx.lineWidth=2.2*px;ctx.stroke(P.pad.fl)}
  const gm=ease((t-55.5)/1.2);
  if(gm>0.001){ctx.globalAlpha=mapA*gm*0.30;ctx.fillStyle=CIAN;ctx.fill(P.pad.mv);ctx.globalAlpha=mapA*gm;ctx.strokeStyle=CIAN;ctx.lineWidth=2.2*px;ctx.stroke(P.pad.mv)}
  ctx.globalAlpha=mapA;
  ctx.strokeStyle='rgba(241,232,212,.85)';ctx.lineWidth=1.8*px;ctx.lineJoin='round';
  ctx.setLineDash([P.L*drawIn+1,P.L*2]);ctx.stroke(P.borde);ctx.setLineDash([]);
  ctx.restore();
  return {c,mapA,gf,gm};
}
const toScreen=(c,p)=>[W/2+(p[0]-c.cx)*c.s,c.sy+(p[1]-c.cy)*c.s];
function bez(a,b,c2,u){const x=(1-u)*(1-u)*a[0]+2*(1-u)*u*c2[0]+u*u*b[0],y=(1-u)*(1-u)*a[1]+2*(1-u)*u*c2[1]+u*u*b[1];return[x,y]}
function glowDot(x,y,col,a,r,pulseT){
  a*=1-0.93*ease((CURT-68.3)/1.0);
  ctx.save();ctx.globalAlpha=a;ctx.shadowColor=col;ctx.shadowBlur=36;ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=col;ctx.lineWidth=3;
  const p=pulseT%1;ctx.globalAlpha=a*(1-p)*0.6;ctx.beginPath();ctx.arc(x,y,r+4+p*60,0,7);ctx.stroke();ctx.restore();
}
function label(x,y,txt,a,align='left',col=CREAM){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.font='700 30px '+SANS;if('letterSpacing' in ctx)ctx.letterSpacing='4px';
  ctx.textAlign=align;ctx.shadowColor='#000';ctx.shadowBlur=14;ctx.fillText(txt.toUpperCase(),x,y);ctx.restore();
}
function strokeCurve(pts,col,w,alpha,head){
  if(pts.length<2)return;
  alpha*=1-0.93*ease((CURT-68.3)/1.0);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=26;ctx.globalAlpha=alpha;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.stroke();
  if(head){const h=pts[pts.length-1];ctx.fillStyle='#fff';ctx.shadowBlur=36;ctx.beginPath();ctx.arc(h[0],h[1],w*1.3,0,7);ctx.fill()}
  ctx.restore();
}
function curvePts(c,a,b,ctrl,u0,u1){const pts=[];const n=90;for(let i=Math.floor(n*u0);i<=n*u1;i++)pts.push(toScreen(c,bez(a,b,ctrl,i/n)));return pts}
let CURT=0;
function threadsLayer(t,m){CURT=t;
  const c=m.c, fade=t>63?1-0.0*ease((t-63)/2):1;
  // hilo ocre 1: mar -> Las Piedras
  let u=ease((t-12.9)/3.6);
  if(u>0) strokeCurve(curvePts(c,SEA,LP,[300,640],0,u),OCRE,8,1,u<1);
  // hilo ocre 2: Las Piedras -> Trinidad (campo)
  u=ease((t-19.0)/4.4);
  if(u>0) strokeCurve(curvePts(c,LP,TR,[170,520],0,u),OCRE,8,1,u<1);
  // puntos
  const aLP=ease((t-15.4)/0.6);
  if(aLP>0){const [x,y]=toScreen(c,LP);glowDot(x,y,OCRE,aLP,10,t*0.8);if(t<27&&t>15.6)label(x+26,y+8,'Las Piedras',aLP*(1-ease((t-19)/1.0)));}
  const aTR=ease((t-21.6)/0.7);
  if(aTR>0){const [x,y]=toScreen(c,TR);const fo=t>48?1:1;glowDot(x,y,OCRE,aTR,10+(t>40?5:0),t*0.9);if(t<48&&t>21.8)label(x-26,y-24,'Trinidad',aTR*(1-ease((t-46)/1.0)),'right');}
  // hilo ocre 3: Trinidad -> Montevideo (la petición viaja)
  u=ease((t-48.6)/3.2);
  if(u>0) strokeCurve(curvePts(c,TR,MV,[150,500],0,u),OCRE,8,1,u<1);
  // hilo cian: Villa Colón / Aguada -> Montevideo (los Nin)
  const aM=ease((t-52.0)/0.8);
  const [mx,my]=toScreen(c,MV);
  if(aM>0){glowDot(mx,my,CIAN,aM,11,t*0.9);label(mx+28,my+46,'Montevideo',aM*(1-ease((t-63)/1.5)),'left');}
  u=ease((t-56.8)/2.2);
  if(u>0){const A=[300,640],B=[MV[0]+4,MV[1]-2];strokeCurve(curvePts(c,A,B,[290,610],0,u),CIAN,8,1,u<1)}
  // destello del encuentro
  const e=(t-59.6);if(e>0&&e<2.4){const k=easeO(e/1.2),a=1-ease((e-0.6)/1.8);ctx.save();ctx.globalAlpha=a*0.8;ctx.strokeStyle=CREAM;ctx.lineWidth=4;ctx.beginPath();ctx.arc(mx,my,20+k*130,0,7);ctx.stroke();ctx.restore()}
}
// ---------- firma ----------
function signatureLayer(t){
  if(t<57.2||t>63.4)return;
  const a=ease((t-57.2)/0.5)*(1-ease((t-62.6)/0.8));
  const k=ease((t-57.6)/2.2);
  ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.beginPath();ctx.rect(0,1050,W*k+40,260);ctx.clip();
  ctx.font='italic 400 112px '+SERIF;ctx.fillStyle=CIAN;ctx.shadowColor=CIAN;ctx.shadowBlur=26;
  ctx.save();ctx.translate(W/2,1190);ctx.rotate(-0.045);ctx.fillText('Federico Nin',0,0);ctx.restore();
  ctx.shadowBlur=0;ctx.strokeStyle=CIAN;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(190,1235);
  ctx.bezierCurveTo(420,1205,640,1262,890,1212);ctx.stroke();
  ctx.restore();
}
// ---------- trenza final (dos hilos) ----------
function braidLayer(t){
  if(t<63||t>72)return;
  const g=ease((t-63)/3.2);
  const ys=1170,ye=1170-g*620;
  const fo=1-ease((t-68.3)/0.9);
  const cols=[OCRE,CIAN];
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(let s=0;s<2;s++){
    ctx.beginPath();let first=true;
    for(let y=ys;y>=ye;y-=6){
      const k=(ys-y)/620;
      const A=(1-0.35*ease(k))*120;
      const x=W/2+A*Math.sin((ys-y)/58+s*Math.PI)*(0.6+0.4*Math.cos((ys-y)/150));
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=cols[s];ctx.shadowColor=cols[s];ctx.shadowBlur=22;ctx.lineWidth=11;ctx.globalAlpha=0.95*fo;ctx.stroke();
  }
  ctx.restore();
}
// ---------- gancho: la petición ----------
function hookLayer(t){
  if(t>8.6)return;
  const fo=1-ease((t-7.6)/0.9);
  ctx.save();ctx.globalAlpha=fo;
  const pw=960,ph=700,py=560;
  const paperA=ease((t-0.2)/1.0);
  ctx.globalAlpha=fo*paperA;ctx.fillStyle='#e9dfc6';
  ctx.save();ctx.translate(W/2,py+ph/2);ctx.rotate(-0.012);
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=60;ctx.shadowOffsetY=20;
  ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  for(let i=0;i<9;i++){ctx.fillStyle='rgba(120,90,50,.035)';ctx.beginPath();ctx.arc(-pw/2+rnd(i)*pw,-ph/2+rnd(i+9)*ph,60+rnd(i+3)*90,0,7);ctx.fill()}
  ctx.fillStyle='#1a140d';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const L=[
   ['PETICIÓN AL SENADO · 1913',0.9,-ph/2+90,700],
   ['Margarita y Gertrudis',2.0,-ph/2+180,400],
   ['de los Campos, solteras,',3.0,-ph/2+245,400],
   ['piden una pensión. Dicen:',4.2,-ph/2+310,400]];
  for(const [s,t0,y,w] of L){ctx.font=w+' 37px '+MONO;ctx.fillText(typed(s,t,t0,26),-pw/2+50,y)}
  const pa=ease((t-5.3)/0.7);ctx.globalAlpha=fo*paperA*pa;
  ctx.font='italic 400 60px '+SERIF;ctx.fillStyle='#1a140d';ctx.fillText('«viven en verdadera',-pw/2+50,ph/2-150);
  const si=ease((t-6.3)/0.5);ctx.globalAlpha=fo*paperA*si;
  ctx.fillStyle=RED;ctx.font='italic 700 84px '+SERIF;ctx.fillText('indigencia»',-pw/2+50,ph/2-52);
  ctx.restore();ctx.restore();
}
// ---------- final ----------
function finaleLayer(t){
  const a2=ease((t-68.8)/0.9);
  if(a2<=0)return;
  ctx.save();ctx.globalAlpha=a2;ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=24;
  if('letterSpacing' in ctx)ctx.letterSpacing='5px';
  ctx.font='700 30px '+SANS;ctx.fillStyle=OCRE;ctx.fillText('PADRÓN I · DE LOS CAMPOS Y SOMA',W/2+3,700);
  if('letterSpacing' in ctx)ctx.letterSpacing='0px';
  ctx.font='400 170px '+SERIF;ctx.fillStyle=CREAM;ctx.fillText('Una',W/2,900);ctx.fillText('firma',W/2,1070);
  ctx.fillStyle=OCRE;ctx.fillRect(W/2-170,1130,160,8);ctx.fillStyle=CIAN;ctx.fillRect(W/2+10,1130,160,8);
  ctx.font='400 32px '+SANS;ctx.fillStyle='rgba(241,232,212,.75)';if('letterSpacing' in ctx)ctx.letterSpacing='3px';
  ctx.fillText('pdelosca.github.io/los-cuatro-padrones',W/2,1260);
  ctx.restore();
}
// ---------- atmósfera ----------
let noiseC=null;
function atmo(t,fadeAll){
  if(!noiseC){noiseC=document.createElement('canvas');noiseC.width=noiseC.height=256;
    const nx=noiseC.getContext('2d'),id=nx.createImageData(256,256);
    for(let i=0;i<id.data.length;i+=4){const v=Math.floor(rnd(i)*255);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=16}
    nx.putImageData(id,0,0)}
  ctx.save();
  const ox=Math.floor(rnd(Math.floor(t*24))*256),oy=Math.floor(rnd(Math.floor(t*24)+7)*256);
  ctx.globalAlpha=0.9;ctx.globalCompositeOperation='overlay';
  const pat=ctx.createPattern(noiseC,'repeat');ctx.translate(-ox,-oy);ctx.fillStyle=pat;ctx.fillRect(0,0,W+256,H+256);
  ctx.restore();
  // viñeta
  const g=ctx.createRadialGradient(W/2,H*0.42,300,W/2,H*0.5,1250);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.78)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // degradé inferior para el texto
  const g2=ctx.createLinearGradient(0,1150,0,1500);g2.addColorStop(0,'rgba(12,10,8,0)');g2.addColorStop(1,'rgba(12,10,8,.75)');
  ctx.fillStyle=g2;ctx.fillRect(0,1150,W,H-1150);
}


window.render=function(t){
  ctx.globalAlpha=1;ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  const m=mapLayer(t);
  threadsLayer(t,m);
  braidLayer(t);
  atmo(t);
  hookLayer(t);
  drawYear(t);drawKicker(t);signatureLayer(t);drawCaption(t);
  finaleLayer(t);
  const f=1-ease(t/0.6),o=ease((t-(DUR-0.8))/0.8);
  ctx.fillStyle='rgba(12,10,8,'+Math.max(f,o)+')';ctx.fillRect(0,0,W,H);
};
fetch('geo.json').then(r=>r.json()).then(g=>{GEO=g;prep();window.READY=true;render(0)});
</script>
