const W=1080,H=1920,DUR=106;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const eO=u=>1-Math.pow(1-clamp(u),3);
const eSin=u=>.5-.5*Math.cos(Math.PI*clamp(u));
const eBack=(u,s=1.7)=>{u=clamp(u);return 1+(s+1)*Math.pow(u-1,3)+s*Math.pow(u-1,2)};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b,c)=>{let h=(a*374761393+b*668265263+c*2147483647)>>>0;h=((h^(h>>>13))*1274126177)>>>0;return(h>>>0)/4294967296};
const mk=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function noise1(t,seed){const i=Math.floor(t),f=t-i,a=rng(i*131+seed)(),b=rng((i+1)*131+seed)();return lerp(a,b,f*f*(3-2*f))*2-1}

const S=mk(),sx=S.getContext('2d'),S2=mk(),sx2=S2.getContext('2d');
let GEO=null,P=null,GRAIN=[],VIG=null;

// ── geometría del país ──
function prepGeo(){
  P={deps:GEO.deps.map(d=>({c:d.c,p:new Path2D(d.d),d:d.d})),borde:new Path2D(GEO.borde),rios:GEO.rios.map(d=>new Path2D(d))};
  const pad=P.deps.filter(d=>d.c.includes('padron'));
  P.fl=pad[2];
  P.bordePts=[...GEO.borde.matchAll(/([\d.]+) ([\d.]+)/g)].map(m=>[+m[1],+m[2]]);
}
const SITE={TR:[158.4,412.5],LP:[226,552],MV:[228.9,568.9]};

// ── texto ──
function txt(x,s,px,py,font,color,align='left',ls=0){
  x.font=font;x.fillStyle=color;x.textAlign=align;x.textBaseline='alphabetic';
  if('letterSpacing' in x)x.letterSpacing=ls+'px';
  x.fillText(s,px,py);
  if('letterSpacing' in x)x.letterSpacing='0px';
}
function lines(x,arr,px,py,lh,font,color,align='left',ls=0){arr.forEach((s,i)=>txt(x,s,px,py+i*lh,font,color,align,ls))}

// ───────────────────────── ACTO 0 · 16 mm: título ─────────────────────────
const INK16='#e9e7df',DARK16='#0e0e0d',OST='"Old Standard TT"';
function ornament(x,cx,cy,w){
  x.save();x.strokeStyle=INK16;x.fillStyle=INK16;x.lineWidth=2;
  x.beginPath();x.moveTo(cx-w/2,cy);x.lineTo(cx-22,cy);x.moveTo(cx+22,cy);x.lineTo(cx+w/2,cy);x.stroke();
  x.beginPath();x.moveTo(cx,cy-11);x.lineTo(cx+11,cy);x.lineTo(cx,cy+11);x.lineTo(cx-11,cy);x.closePath();x.fill();
  [-1,1].forEach(s=>{x.beginPath();x.arc(cx+s*(w/2+8),cy,4,0,7);x.fill()});x.restore();
}
function cardFrame(x){
  x.fillStyle=DARK16;x.fillRect(0,0,W,H);
  x.strokeStyle=INK16;x.lineWidth=3;x.strokeRect(54,150,W-108,H-300);
  x.lineWidth=1.5;x.strokeRect(70,166,W-140,H-332);
  [[54,150,1,1],[W-54,150,-1,1],[54,H-150,1,-1],[W-54,H-150,-1,-1]].forEach(([px,py,a,b])=>{
    x.save();x.translate(px,py);x.scale(a,b);x.fillStyle=INK16;
    x.fillRect(-8,-8,34,5);x.fillRect(-8,-8,5,34);x.fillRect(30,16,22,3);x.fillRect(16,30,3,22);
    x.beginPath();x.moveTo(34,34);x.lineTo(42,42);x.lineTo(34,50);x.lineTo(26,42);x.closePath();x.fill();x.restore();
  });
}
const CARDS={};
function card(name,draw){const c=mk(),x=c.getContext('2d');cardFrame(x);draw(x);CARDS[name]=c}
function buildCards(){
  card('titulo',x=>{
    txt(x,'PADRÓN I',W/2+7,620,`400 40px ${OST}`,INK16,'center',14);
    ornament(x,W/2,680,520);
    txt(x,'El vizcaíno',W/2,880,`700 128px ${OST}`,INK16,'center',2);
    txt(x,'y el chofer',W/2,1020,`700 128px ${OST}`,INK16,'center',2);
    ornament(x,W/2,1110,380);
    txt(x,'Una línea de los de los Campos',W/2,1210,`italic 400 46px ${OST}`,INK16,'center',2);
    txt(x,'MDCCLIII — MM',W/2+5,1310,`400 34px ${OST}`,INK16,'center',10);
  });
  card('boda',x=>{
    txt(x,'XXVI · I · MCMXLVI',W/2+5,640,`700 66px ${OST}`,INK16,'center',6);
    ornament(x,W/2,712,420);
    lines(x,['Eloy, de veintiséis años,','chofer de Trinidad,','se casa con Reina,','de veinticuatro,','la muchacha de Fraile Muerto.'],W/2,880,92,`italic 400 66px ${OST}`,INK16,'center',1);
    ornament(x,W/2,1370,300);
  });
  card('muerte',x=>{
    lines(x,['Murió el 9 de enero','del año 2000,','el día que cumplía','ochenta años.'],W/2,740,124,`italic 400 100px ${OST}`,INK16,'center',1);
    ornament(x,W/2,1290,320);
  });
  card('linea',x=>{
    lines(x,['Empezó con','un vizcaíno.'],W/2,640,120,`700 100px ${OST}`,INK16,'center',1);
    ornament(x,W/2,860,300);
    lines(x,['Llegó a','un chofer.'],W/2,990,120,`700 100px ${OST}`,INK16,'center',1);
    ornament(x,W/2,1210,300);
    lines(x,['Sigue en','Facundo y Camila.'],W/2,1340,110,`italic 400 82px ${OST}`,INK16,'center',1);
  });
  card('fin',x=>{
    txt(x,'FIN',W/2+16,1020,`700 250px ${OST}`,INK16,'center',30);
    ornament(x,W/2,1110,460);
    txt(x,'pdelosca.github.io/los-cuatro-padrones',W/2,1260,`400 34px "Courier Prime"`,INK16,'center',1);
  });
}
function cardShow(x,img,t,t0,t1,zoom=0.035){
  const z=1+zoom*seg(t,t0,t0+4);
  x.fillStyle=DARK16;x.fillRect(0,0,W,H);
  x.drawImage(img,W/2-W*z/2,H/2-H*z/2,W*z,H*z);
  const k=(1-eO(seg(t,t0,t0+0.45)))+seg(t,t1-0.3,t1);
  if(k>0){x.fillStyle=`rgba(0,0,0,${clamp(k)})`;x.fillRect(0,0,W,H)}
}
function leader(x,t,t0,n){
  const u=seg(t,t0,t0+0.7);
  x.fillStyle='#b3b2ac';x.fillRect(0,0,W,H);
  x.fillStyle='#4a4946';x.beginPath();x.moveTo(W/2,H/2);x.arc(W/2,H/2,1800,-Math.PI/2,-Math.PI/2+Math.PI*2*u);x.closePath();x.fill();
  x.strokeStyle='#f4f3ee';x.lineWidth=7;
  x.beginPath();x.arc(W/2,H/2,330,0,7);x.stroke();x.beginPath();x.arc(W/2,H/2,400,0,7);x.stroke();
  x.lineWidth=4;x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();
  txt(x,String(n),W/2,H/2+150,`700 460px ${OST}`,'#121211','center');
}
function actTitulo(x,t){
  if(t<0.12){x.fillStyle='#000';x.fillRect(0,0,W,H);return}
  if(t<0.82)return leader(x,t,0.12,3);
  if(t<1.5)return leader(x,t,0.82,2);
  if(t<1.72){x.fillStyle='#000';x.fillRect(0,0,W,H);return}
  cardShow(x,CARDS.titulo,t,1.72,99);
}
function actCierre(x,t,dur){
  if(t<3.9)return cardShow(x,CARDS.boda,t,0.2,3.95);
  if(t<7.4)return cardShow(x,CARDS.muerte,t,3.9,7.45);
  if(t<10.9)return cardShow(x,CARDS.linea,t,7.4,10.95);
  cardShow(x,CARDS.fin,t,10.9,99,0.02);
  if(t>12.6){
    const u=eIO(seg(t,12.6,dur-0.15)),rr=lerp(1500,0,u);
    x.save();x.fillStyle='#000';x.beginPath();x.rect(0,0,W,H);x.arc(W/2,H/2+40,Math.max(.1,rr),0,7,true);x.fill('evenodd');x.restore();
  }
}

// ───────────────────────── ACTO 1 · LÁPIZ (karakalem) ─────────────────────────
const PAPERCV=mk(),TOOTH=mk(),GR=mk(),gx=GR.getContext('2d');
const PAPER='#eeebe3',GRAPH='rgba(38,36,32,',RED_P='rgba(176,64,44,';
function buildPaper(){
  const c=PAPERCV.getContext('2d');c.fillStyle=PAPER;c.fillRect(0,0,W,H);
  const r=rng(3),low=mk(60,107),lc=low.getContext('2d'),li=lc.createImageData(60,107);
  for(let i=0;i<li.data.length;i+=4){const v=128+(r()-.5)*60;li.data[i]=li.data[i+1]=li.data[i+2]=v;li.data[i+3]=255}
  lc.putImageData(li,0,0);const big=mk(),bc=big.getContext('2d');bc.imageSmoothingQuality='high';bc.drawImage(low,0,0,W,H);
  const bd=bc.getImageData(0,0,W,H).data,id=c.getImageData(0,0,W,H),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-.5)*14+(bd[i]-128)*.12;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.9}
  c.putImageData(id,0,0);
  const v=c.createRadialGradient(W/2,H/2,500,W/2,H/2,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(50,40,30,.18)');c.fillStyle=v;c.fillRect(0,0,W,H);
  const tc=TOOTH.getContext('2d'),ti=tc.createImageData(W,H),td=ti.data,r2=rng(11);
  for(let i=0;i<td.length;i+=4){const k=i/4,xx=k%W,yy=(k/W)|0;const fib=Math.sin(xx*.9+yy*.35)*.5+.5;
    td[i]=td[i+1]=td[i+2]=0;td[i+3]=clamp(.42+r2()*.58*(.8+fib*.2)+(bd[i]-128)/400,0,1)*255}
  tc.putImageData(ti,0,0);
}
const MS=1.5,MC=[540,730];
const toS=p=>[MC[0]+(p[0]-260)*MS,MC[1]+(p[1]-300)*MS];
function pencil(g,pts,u,w,a,seed,t,col=GRAPH){
  const n=Math.min(pts.length-1,Math.floor((pts.length-1)*u));if(n<2)return;
  const fb=Math.floor(t*12);
  for(let pass=0;pass<2;pass++){
    g.beginPath();
    for(let i=0;i<=n;i++){const p=pts[i],j=(hash(i,seed+pass*7,fb)-.5)*2.4,k=(hash(i,seed+pass*7+3,fb)-.5)*2.4;
      i?g.lineTo(p[0]+j,p[1]+k):g.moveTo(p[0]+j,p[1]+k)}
    g.strokeStyle=col+(a*(pass?.55:1))+')';g.lineWidth=w*(pass?.7:1);g.lineJoin='round';g.lineCap='round';g.stroke();
  }
}
function bezPts(a,b,c,n=60){const o=[];for(let i=0;i<=n;i++){const u=i/n;o.push([(1-u)*(1-u)*a[0]+2*(1-u)*u*c[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*c[1]+u*u*b[1]])}return o}
function hand(g,s,px,py,size,u,col=GRAPH,align='left'){
  g.save();g.font=`500 ${size}px Caveat`;g.textAlign=align;
  const w=g.measureText(s).width,x0=align==='center'?px-w/2:align==='right'?px-w:px;
  g.beginPath();g.rect(x0-8,py-size,(w+16)*clamp(u),size*1.5);g.clip();
  g.fillStyle=col+'.92)';g.textAlign='left';g.fillText(s,x0,py);g.restore();
}
function ship(g,px,py,sc,t){
  g.save();g.translate(px,py+Math.sin(t*2.2)*4);g.rotate(Math.sin(t*1.7)*0.05);g.scale(sc,sc);
  g.strokeStyle=GRAPH+'.85)';g.lineWidth=2.4;g.lineJoin='round';
  g.beginPath();g.moveTo(-46,0);g.quadraticCurveTo(0,26,46,0);g.lineTo(34,-8);g.lineTo(-38,-8);g.closePath();g.stroke();
  g.beginPath();g.moveTo(0,-8);g.lineTo(0,-82);g.stroke();
  g.beginPath();g.moveTo(3,-78);g.quadraticCurveTo(32,-52,28,-16);g.lineTo(3,-16);g.closePath();g.stroke();
  g.beginPath();g.moveTo(-3,-70);g.quadraticCurveTo(-26,-48,-24,-16);g.lineTo(-3,-16);g.closePath();g.stroke();
  for(let i=0;i<5;i++){g.beginPath();g.moveTo(8,-62+i*9);g.lineTo(24-i,-60+i*9);g.stroke()}
  g.restore();
}
function circleHand(g,cx,cy,r,u,seed,t){
  const pts=[];for(let i=0;i<=44;i++){const a=-1.2+i/44*Math.PI*2.15,e=1+.04*Math.sin(i*.3+seed);pts.push([cx+Math.cos(a)*r*e,cy+Math.sin(a)*r*e*.82])}
  pencil(g,pts,u,3,.8,seed,t,RED_P);
}
const LAP_CAPS=[
 [2.8,6.8,['1753. Miguel de los Campos nace','en una aldea de Vizcaya.'],0],
 [6.8,10.6,['Cruza el océano y se casa en','Las Piedras, con Clara Chavarría.'],0],
 [10.6,14.6,['Su campo queda entre el Sarandí,','el Marincho y el Yí.'],0],
 [14.6,19,['Tres gobiernos distintos','se lo ratifican.'],0],
];
function actLapiz(x,t,dur){
  gx.clearRect(0,0,W,H);
  // departamentos, tenues
  gx.save();gx.setTransform(MS,0,0,MS,MC[0]-260*MS,MC[1]-300*MS);
  gx.globalAlpha=.22*eO(seg(t,.8,3));gx.strokeStyle=GRAPH+'1)';gx.lineWidth=.9/MS;
  for(const d of P.deps)gx.stroke(d.p);
  gx.globalAlpha=.3*eO(seg(t,1.4,3.6));gx.strokeStyle='rgba(60,80,110,1)';gx.lineWidth=1.2/MS;for(const r of P.rios)gx.stroke(r);
  gx.restore();
  // contorno del país
  const bp=P.bordePts.filter((_,i)=>i%2===0).map(toS);
  pencil(gx,bp,eIO(seg(t,.3,4.0)),3.2,.92,5,t);
  // Flores: tramado
  if(t>10.4){
    gx.save();gx.setTransform(MS,0,0,MS,MC[0]-260*MS,MC[1]-300*MS);gx.clip(P.fl.p);gx.setTransform(1,0,0,1,0,0);
    const n=34,u=seg(t,10.6,14);
    for(let i=0;i<n*u;i++){const yy=360+i*18;pencil(gx,[[100,yy+130],[1000,yy-130]],1,2.8,.8,40+i,t)}
    gx.restore();
    gx.save();gx.setTransform(MS,0,0,MS,MC[0]-260*MS,MC[1]-300*MS);gx.lineWidth=4/MS;gx.strokeStyle=GRAPH+'.85)';gx.globalAlpha=eO(seg(t,10.4,12.4));gx.stroke(P.fl.p);gx.restore();
  }
  // ruta Vizcaya → Las Piedras (barco)
  const LPs=toS(SITE.LP),TRs=toS(SITE.TR);
  const r1=bezPts([-40,1330],[LPs[0],LPs[1]+14],[420,1380]);
  const u1=eIO(seg(t,3.6,8.2));
  if(u1>0){
    const sparse=r1.filter((_,i)=>Math.floor(i/2)%2===0);
    pencil(gx,r1,u1,2.2,.55,60,t);
    const p=r1[Math.min(r1.length-1,Math.floor(u1*(r1.length-1)))];
    ship(gx,p[0],p[1]-12,1.35,t);
  }
  if(t>8.2){
    const a=eO(seg(t,8.2,9.2));
    gx.save();gx.globalAlpha=a;gx.fillStyle=RED_P+'1)';gx.beginPath();gx.arc(LPs[0],LPs[1],9,0,7);gx.fill();gx.restore();
    hand(gx,'Las Piedras',LPs[0]+22,LPs[1]+8,48,seg(t,8.3,9.6),GRAPH);
  }
  hand(gx,'Vizcaya',60,1300,56,seg(t,3.7,5.0),GRAPH);
  // ruta Las Piedras → Trinidad, punteada
  const r2=bezPts(LPs,TRs,[LPs[0]-110,(LPs[1]+TRs[1])/2+30],50);
  const u2=eIO(seg(t,10.0,12.0));
  for(let i=0;i<r2.length-1;i++){if(i/(r2.length-1)>u2)break;if(i%3!==2){pencil(gx,[r2[i],r2[i+1]],1,2.6,.8,100+i,t,RED_P)}}
  if(t>12){const a=eO(seg(t,12,13));gx.save();gx.globalAlpha=a;gx.fillStyle=RED_P+'1)';gx.beginPath();gx.arc(TRs[0],TRs[1],10,0,7);gx.fill();gx.restore();
    hand(gx,'Trinidad',TRs[0]-26,TRs[1]+4,50,seg(t,12.1,13.3),GRAPH,'right')}
  // ríos / límites (rótulos)
  const fb=[0,0];
  hand(gx,'Yí',TRs[0]+20,TRs[1]-96,52,seg(t,12.4,13.0),RED_P);
  hand(gx,'Sarandí',TRs[0]+82,TRs[1]+40,48,seg(t,12.9,13.8),RED_P);
  hand(gx,'Marincho',TRs[0]-96,TRs[1]+86,46,seg(t,13.4,14.4),RED_P,'right');
  // sellos
  [['1810',250,0],['1815',540,1],['1821',830,2]].forEach(([y,cx,i])=>{
    const t0=15.2+i*0.7,u=seg(t,t0,t0+0.8);if(u<=0)return;
    hand(gx,y,cx,1240,66,seg(t,t0,t0+0.5),GRAPH,'center');
    circleHand(gx,cx,1222,70,eO(u),i*3+1,t);
  });
  // leyendas
  LAP_CAPS.forEach(([a,b,ls,k])=>{
    if(t<a||t>b)return;
    const fo=1-seg(t,b-0.45,b);gx.save();gx.globalAlpha=fo;
    ls.forEach((s,i)=>hand(gx,s,W/2,1420+i*78,66,seg(t,a+i*.5,a+i*.5+1.1),GRAPH,'center'));
    gx.restore();
  });
  // compone: papel + grafito con diente
  x.drawImage(PAPERCV,0,0);
  const mc=mk(),mx=mc.getContext('2d');mx.drawImage(GR,0,0);mx.globalCompositeOperation='destination-in';mx.drawImage(TOOTH,0,0);
  x.globalCompositeOperation='multiply';x.drawImage(mc,0,0);x.globalCompositeOperation='source-over';
}

// ───────────────────────── ACTO 2 · CÓMIC ─────────────────────────
const CY='#f6c928',CR='#e23b2e',CB='#3f88c5',CT='#3aa6a0',CC='#f3e6c4',CK='#14110f',CBR='#8a5a2b';
const HT={};
function halftone(key,w,h,col,sp,dir){
  const c=mk(w,h),x=c.getContext('2d');x.fillStyle=col;
  for(let yy=0;yy<h+sp;yy+=sp)for(let xx=0;xx<w+sp;xx+=sp){
    const ox=((yy/sp)|0)%2?sp/2:0,u=dir==='v'?yy/h:dir==='h'?xx/w:Math.hypot(xx-w/2,yy-h/2)/Math.hypot(w/2,h/2);
    const r=sp*0.5*clamp(u)*0.95;if(r>0.8){x.beginPath();x.arc(xx+ox,yy,r,0,7);x.fill()}}
  HT[key]=c;
}
function buildComic(){
  halftone('p1',960,620,'rgba(30,70,120,.45)',16,'v');
  halftone('p2',960,620,'rgba(160,20,10,.5)',16,'c');
  halftone('p3',960,560,'rgba(10,40,45,.5)',16,'v');
  halftone('p4',960,560,'rgba(90,40,10,.45)',16,'h');
}
function panelBox(x,px,py,pw,ph,u,col,ht){
  const s=eBack(u,1.4);if(u<=0)return null;
  x.save();x.translate(px+pw/2,py+ph/2);x.scale(s,s);x.translate(-pw/2,-ph/2);
  x.beginPath();x.rect(0,0,pw,ph);x.clip();
  x.fillStyle=col;x.fillRect(0,0,pw,ph);
  if(ht)x.drawImage(HT[ht],0,0,pw,ph);
  return true;
}
function panelEnd(x,pw,ph){x.restore();}
function frameP(x,px,py,pw,ph,u){
  if(u<=0)return;const s=eBack(u,1.4);x.save();x.translate(px+pw/2,py+ph/2);x.scale(s,s);x.translate(-pw/2,-ph/2);
  x.lineWidth=9;x.strokeStyle=CK;x.lineJoin='miter';x.strokeRect(0,0,pw,ph);x.restore();
}
function box(x,s,px,py,font,fill,fg,pad=16,w0){
  x.font=font;const w=w0||x.measureText(s).width;x.fillStyle=fill;x.strokeStyle=CK;x.lineWidth=5;
  x.fillRect(px,py,w+pad*2,60);x.strokeRect(px,py,w+pad*2,60);txt(x,s,px+pad,py+44,font,fg);return w+pad*2;
}
function narr(x,ls,px,py,u,font='700 40px Kalam'){
  x.save();x.globalAlpha=eO(u);x.translate(0,(1-eO(u))*18);
  x.font=font;const w=Math.max(...ls.map(s=>x.measureText(s).width))+44,h=ls.length*52+30;
  x.fillStyle=CY;x.strokeStyle=CK;x.lineWidth=5;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h);
  ls.forEach((s,i)=>txt(x,s,px+22,py+52+i*52,font,CK));x.restore();
}
function balloon(x,s,cx,cy,font,u,tail=[0,60]){
  const sc=eBack(u,2.2);if(u<=0)return;x.save();x.translate(cx,cy);x.scale(sc,sc);
  x.font=font;const w=x.measureText(s).width+56,h=110;
  x.fillStyle='#fff';x.strokeStyle=CK;x.lineWidth=6;
  x.beginPath();x.ellipse(0,0,w/2,h/2,0,0,7);x.fill();x.stroke();
  x.beginPath();x.moveTo(-20,h/2-6);x.lineTo(tail[0],h/2+tail[1]);x.lineTo(24,h/2-8);x.fillStyle='#fff';x.fill();x.stroke();
  x.beginPath();x.moveTo(-18,h/2-9);x.lineTo(22,h/2-11);x.strokeStyle='#fff';x.lineWidth=9;x.stroke();
  txt(x,s,0,14,font,CK,'center');x.restore();
}
function burst(x,cx,cy,r1,r2,n,col,rot=0){
  x.beginPath();for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*Math.PI*2,r=i%2?r1:r2;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}
  x.closePath();x.fillStyle=col;x.fill();x.strokeStyle=CK;x.lineWidth=7;x.lineJoin='round';x.stroke();
}
function person(x,px,py,s,col,arm=0,hat=false){
  x.save();x.translate(px,py);x.scale(s,s);x.fillStyle=col;x.strokeStyle=CK;x.lineWidth=5;
  x.beginPath();x.roundRect(-20,10,40,70,10);x.fill();x.stroke();
  if(arm){x.beginPath();x.moveTo(14,22);x.lineTo(34,-24);x.lineWidth=11;x.stroke();x.lineWidth=5;}
  x.beginPath();x.arc(0,-8,19,0,7);x.fillStyle='#f0c9a0';x.fill();x.stroke();
  if(hat){x.fillStyle=CK;x.fillRect(-26,-22,52,8);x.fillRect(-15,-42,30,22)}
  x.restore();
}
function door(x,cx,cy,s,open){

  x.fillRect(-100,-150,200,300);x.strokeRect(-100,-150,200,300);

const KB='#ece6d9',KI='#16130f',KR='#d6452a';
function word(x,s,cx,cy,font,color,t,t0,t1,size,mode='up',align='center'){
  if(t<t0||t>t1+0.45)return;
  const ui=eO(seg(t,t0,t0+0.55)),uo=eIO(seg(t,t1,t1+0.4));
  x.save();x.font=font;const w=x.measureText(s).width;
  const bx=align==='center'?cx-w/2:align==='left'?cx:cx-w;
  x.beginPath();x.rect(bx-30,cy-size*0.95,w+60,size*1.25);x.clip();
  let dx=0,dy=0;
  if(mode==='up'){dy=(1-ui)*size*1.1-uo*size*1.1}
  else if(mode==='left'){dx=(1-ui)*-w-uo*w}
  else if(mode==='right'){dx=(1-ui)*w+uo*w*-1}
  else if(mode==='down'){dy=-(1-ui)*size*1.1+uo*size*1.1}
  x.fillStyle=color;x.textAlign='left';x.textBaseline='alphabetic';
  x.fillText(s,bx+dx,cy+dy);x.restore();
}

const RC='#f4e3b8',RO='#e8742a',RD='#b8401a',RB='#3c1f10',RY='#f0b429',RM='#d89c1e';
function sunburst(x,cx,cy,t,rot){
  x.fillStyle=RC;x.fillRect(0,0,W,H);
  const n=28;
  for(let i=0;i<n;i++){const a0=rot+i/n*Math.PI*2,a1=rot+(i+.5)/n*Math.PI*2;
    x.fillStyle=i%2?'#f2d08a':'#f8e9c4';x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,2600,a0,a1);x.closePath();x.fill()}
}
function stripes(x,y0,u){
  const cols=[RY,RM,RO,RD,RB];
  cols.forEach((c,i)=>{x.fillStyle=c;const yy=y0+i*34;x.beginPath();x.moveTo(0,yy+Math.sin(0)*8);
    for(let xx=0;xx<=W;xx+=20)x.lineTo(xx,yy+Math.sin(xx/110+i*.8+u)*12);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill()});
}
function title70(x,s,cx,cy,size,u,font='900'){
  x.save();x.translate(cx,cy);const sc=eBack(u,1.6);x.scale(sc,sc);

  [[14,RB],[9,RD],[4.5,RO]].forEach(([o,c])=>{txt(x,s,o,o,f,c,'center')});
  txt(x,s,0,0,f,RC,'center');x.restore();
}
function wheel(x,cx,cy,r,rot,spokes,col,hub){
  x.save();x.translate(cx,cy);x.rotate(rot);x.strokeStyle=col;x.lineWidth=r*.16;x.beginPath();x.arc(0,0,r,0,7);x.stroke();
  x.lineWidth=r*.09;for(let i=0;i<spokes;i++){const a=i/spokes*Math.PI*2;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*r,Math.sin(a)*r);x.stroke()}
  x.fillStyle=hub;x.beginPath();x.arc(0,0,r*.2,0,7);x.fill();x.restore();
}
function tiles(x,cx,cy,sz,t){
  x.save();x.translate(cx,cy);
  for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const k=eBack(seg(t,(i+j+4)*.05,(i+j+4)*.05+.5),1.5);
    x.save();x.translate(i*sz,j*sz);x.rotate(Math.PI/4);x.scale(k,k);x.fillStyle=(i+j)%2?RO:RB;x.fillRect(-sz*.34,-sz*.34,sz*.68,sz*.68);x.restore()}
  x.restore();

function cloche(x,cx,cy,s,u){

    const a=eO(seg(t,4.7,5.4))*(1-seg(t,8.6,9));
    x.save();x.globalAlpha=a;
    cloche(x,W/2,760,1.5,seg(t,4.7,5.6));
    txt(x,'A LOS OCHO',W/2,1090,'400 112px Monoton',RB,'center',14);
    lines(x,['dejó la escuela y llevaba comida','de un hotel de Durazno.','Así lo cuenta la familia.'],W/2,1210,74,'500 56px Fredoka',RB,'center');
    x.restore();
  }
  // b3 · oficios
  const jobs=[['CHOFER.',9.0,10.9],['BALDOSAS.',10.9,12.8],['BICICLETA.',12.8,14.8]];
  jobs.forEach(([s,a,b],i)=>{
    if(t<a||t>b+.4)return;
    const k=eO(seg(t,a,a+.5)),o=1-seg(t,b,b+.4);x.save();x.globalAlpha=k*o;x.translate(0,(1-k)*60);
    if(i===0)wheel(x,W/2,760,230,t*2.2,3,RB,RD);
    if(i===1)tiles(x,W/2,760,150,t-a);
    if(i===2){wheel(x,W/2-210,780,150,-t*2.4,12,RB,RD);wheel(x,W/2+210,780,150,-t*2.4,12,RB,RD);
      x.strokeStyle=RB;x.lineWidth=18;x.beginPath();x.moveTo(W/2-210,780);x.lineTo(W/2-30,640);x.lineTo(W/2+210,780);x.moveTo(W/2-30,640);x.lineTo(W/2-60,780);x.moveTo(W/2-210,780);x.lineTo(W/2-60,780);x.lineTo(W/2+30,560);x.stroke();}
    title70(x,s,W/2,1190,[200,150,150][i],seg(t,a+.1,a+.7),'900');
    const sub=['','Mosaicos Rivas y Cía.','Club Olimpia, de Colón'][i];
    if(sub)txt(x,sub,W/2,1290,'700 54px Fredoka',RB,'center');
    x.restore();
  });
  // b4 · Magallanes 1973
  if(t>=15.2){
    const a=eO(seg(t,15.3,16.0));
    // arcos de atardecer
    [RY,RM,RO,RD].forEach((c,i)=>{x.fillStyle=c;x.beginPath();x.arc(W/2,1650,520-i*105,Math.PI,0);x.fill()});
    stripes(x,1480,u);
    const blink=0.75+0.25*Math.sin(t*9);
    x.save();x.globalAlpha=a;
    txt(x,'MAGALLANES',W/2,500,'400 130px Monoton',RB,'center');
    txt(x,'1973',W/2,700,'900 230px Fraunces',RO,'center');
    txt(x,'1973',W/2+8,708,'900 230px Fraunces',RB,'center');
    txt(x,'1973',W/2,700,'900 230px Fraunces',RC,'center');
    x.restore();
    x.save();x.globalAlpha=eO(seg(t,16.7,17.5));txt(x,'VIERNES',W/2,880,'400 150px Monoton',RD,'center');x.restore();
    x.save();x.globalAlpha=eO(seg(t,17.8,18.6))*blink;
    lines(x,['Asado con carbón bajo tierra,','en un sótano de la esquina.'],W/2,1010,74,'700 58px Fredoka',RB,'center');x.restore();
    x.save();x.globalAlpha=eO(seg(t,19.8,20.6));
    lines(x,['Truco, sí.','Tute cabrero, no.'],W/2,1180,92,'400 78px Shrikhand',RB,'center');x.restore();
  }
  // viñeta de color
  const g=x.createRadialGradient(W/2,H/2,500,W/2,H/2,1250);g.addColorStop(0,'rgba(70,30,0,0)');g.addColorStop(1,'rgba(70,30,0,.4)');x.fillStyle=g;x.fillRect(0,0,W,H);
}

// ───────────────────────── MONTAJE ─────────────────────────
const ACTS=[
 {a:0,b:7,bw:true,fn:actTitulo},
 {a:7,b:26,fn:actLapiz},
 {a:26,b:48,fn:actComic},
 {a:48,b:70,fn:actKinetico},
 {a:70,b:92,fn:actRetro},
 {a:92,b:106,bw:true,fn:actCierre},
];
const actAt=T=>ACTS.find(a=>T>=a.a&&T<a.b)||ACTS[ACTS.length-1];
function sceneAt(x,T){const A=actAt(T);x.save();x.globalAlpha=1;x.globalCompositeOperation='source-over';A.fn(x,T-A.a,A.b-A.a);x.restore()}
function buildGrain(seed){const w=540,h=960,c=mk(w,h),x=c.getContext('2d'),d=x.createImageData(w,h),r=rng(seed);
  for(let i=0;i<w*h;i++){const v=128+(r()+r()+r()+r()-2)*170;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255}x.putImageData(d,0,0);return c}
function buildVig(){const c=mk(),x=c.getContext('2d');const g=x.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.82);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.7,'rgba(0,0,0,.3)');g.addColorStop(1,'rgba(0,0,0,.85)');x.fillStyle=g;x.fillRect(0,0,W,H);return c}
function render(T){
  const f=Math.floor(T*30),r=rng(f*977+13);
  const A=actAt(T);
  // salto de fotograma entre actos
  const bounds=ACTS.slice(1).map(a=>a.a);
  const bd=bounds.find(b=>Math.abs(T-b)<0.16);
  if(bd!==undefined){
    const u=eIO((T-(bd-0.16))/0.32),bar=110,off=u*(H+bar);
    sceneAt(sx2,bd-0.02);sx.fillStyle='#050505';sx.fillRect(0,0,W,H);sx.drawImage(S2,0,off);
    sceneAt(sx2,bd+0.02);sx.drawImage(S2,0,off-H-bar);
    sx.globalAlpha=.3;sx.drawImage(S,0,-26);sx.drawImage(S,0,26);sx.globalAlpha=1;
  } else sceneAt(sx,T);
  const bw=A.bw||(bd!==undefined&&(actAt(bd-0.02).bw||actAt(bd+0.02).bw));
  const amt=A.bw?1:0.55;
  const wx=noise1(T*3,1)*3*amt+(r()-.5)*1.2*amt,wy=noise1(T*2.3,2)*4*amt+(r()-.5)*1.5*amt;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.filter=A.bw?'blur(1.1px) grayscale(1) contrast(1.12)':'blur(0.4px)';
  ctx.drawImage(S,wx,wy);ctx.filter='none';
  const flick=0.07*amt*noise1(T*9,3)+(r()-.5)*0.06*amt;
  if(flick>0){ctx.globalCompositeOperation='screen';ctx.fillStyle=`rgba(255,255,255,${flick})`}
  else{ctx.globalCompositeOperation='multiply';const v=Math.round(255*(1+flick));ctx.fillStyle=`rgb(${v},${v},${v})`}
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.42*amt;
  ctx.drawImage(GRAIN[f%GRAIN.length],-r()*80,-r()*80,W*1.4+160,H*1.4+160);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // rayas y polvo
  const nd=Math.floor((2+r()*6)*amt);
  for(let i=0;i<nd;i++){const white=r()<.55,px=r()*W,py=r()*H,s=1.5+r()*r()*9;
    ctx.fillStyle=white?`rgba(250,250,245,${.45+r()*.4})`:`rgba(0,0,0,${.5+r()*.4})`;ctx.beginPath();ctx.ellipse(px,py,s,s*(.5+r()*.6),r()*3,0,7);ctx.fill()}
  [[.31,0,106],[.72,0,106]].forEach(([x0,a,b],i)=>{
    const xx=(x0+noise1(T*.6,10+i)*.03)*W,al=(.1+.2*Math.abs(noise1(T*12,20+i)))*amt;
    ctx.fillStyle=`rgba(245,245,240,${al})`;ctx.fillRect(xx,0,1.6+(i%2),H)});
  if(r()<.2*amt){const px=r()*W,py=r()*H,L=40+r()*120;ctx.strokeStyle=r()<.5?'rgba(0,0,0,.7)':'rgba(250,250,245,.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px,py);ctx.bezierCurveTo(px+L*r(),py-L*.5,px-L*.3,py+L*r(),px+L*(r()-.5),py+L);ctx.stroke()}
  ctx.globalAlpha=A.bw?1:.55;ctx.drawImage(VIG,0,0);ctx.globalAlpha=1;
  // fundido de entrada y salida
  const fi=1-eO(T/0.5),fo=eO((T-(DUR-0.6))/0.6);
  if(Math.max(fi,fo)>0){ctx.fillStyle=`rgba(0,0,0,${Math.max(fi,fo)})`;ctx.fillRect(0,0,W,H)}
}
window.render=render;

   '900 100px Fraunces','700 60px Fredoka','500 60px Fredoka','400 60px Monoton','400 60px Shrikhand'];
  await Promise.all(fs.map(f=>document.fonts.load(f,'ÁÉÍÓÚáéíóúñÑ¡¿·—«»✔0123456789ABC')));
  await document.fonts.ready;
  GEO=await (await fetch('geo.json')).json();prepGeo();
  for(let i=0;i<8;i++)GRAIN.push(buildGrain(i*37+5));
  VIG=buildVig();buildCards();buildPaper();buildComic();
